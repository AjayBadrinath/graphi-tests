# SonarQube project configuration
sonar.projectKey=graphi-python-be
sonar.projectName=GraphI Python Backend
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Project sources
sonar.sources=modules,utils
sonar.tests=.
sonar.test.inclusions=test_*.py,*_test.py

# Python specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/htmlcov/**,**/.venv/**,**/venv/**

# Code analysis
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
